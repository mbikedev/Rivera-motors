# Netlify configuration for the Next.js App Router site.
# Netlify detects Next.js and installs its Next.js runtime automatically (no plugin entry needed).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Production must use the real database – fail the build if Supabase variables are missing.
[context.production.environment]
  REQUIRE_SUPABASE = "true"

# Deploy previews / branch deploys may run on demo data when no Supabase variables are set.
[context.deploy-preview.environment]
  REQUIRE_SUPABASE = "false"
