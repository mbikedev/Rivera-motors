# Minimal Supabase CLI configuration for local development (`supabase start`).
# The hosted project is configured in the Supabase dashboard – see docs/DEPLOYMENT.md.
project_id = "rivera-motors"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin/auth/callback"]
# Administrators are created by the owner only – there is no public registration.
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
